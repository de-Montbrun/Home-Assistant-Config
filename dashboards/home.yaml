            {% set watches = states('sensor.saint_john_watches') %}
            {% set advisory = states('sensor.saint_john_advisory') %}
          {% elif city == 'Montreal' %}
            {% set warnings = states('sensor.montreal_warnings') %}
            {% set watches = states('sensor.montreal_watches') %}
            {% set advisory = states('sensor.montreal_advisory') %}
          {% elif city == 'Atlanta' %}
            {% set warnings = 'none' %}
            {% set watches = 'none' %}
            {% set advisory = 'none' %}
          {% elif city == 'Las Vegas' %}
            {% set warnings = 'none' %}
            {% set watches = 'none' %}
            {% set advisory = 'none' %}
          {% else %}
            {% set warnings = 'unknown' %}
            {% set watches = 'unknown' %}
            {% set advisory = 'unknown' %}
          {% endif %} {% if warnings not in ['unknown', 'unavailable', 'none',
          ''] %}
            **⚠️ Warnings:** {{ warnings }}
          {% endif %}  {% if watches not in ['unknown', 'unavailable', 'none',
          ''] %}
            **👀 Watches:** {{ watches }}
          {% endif %}  {% if advisory not in ['unknown', 'unavailable', 'none',
          ''] %}
            **ℹ️ Advisory:** {{ advisory }}
          {% endif %}  {% if warnings in ['unknown', 'unavailable', 'none', '']
          and watches in ['unknown', 'unavailable', 'none', ''] and advisory in
          ['unknown', 'unavailable', 'none', ''] %}
            No active weather alerts for {{ city }}.
          {% endif %}
