            {% set advisory = states('sensor.charlottetown_advisory') %}
          {% elif city == 'Fredericton' %}
            {% set warnings = states('sensor.fredericton_warnings') %}
            {% set watches = states('sensor.fredericton_watches') %}
            {% set advisory = states('sensor.fredericton_advisory') %}
          {% elif city == 'Saint John' %}
