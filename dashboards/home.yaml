  - title: Robots
    theme: Glass
    path: robots
    icon: mdi:robot-vacuum
    badges: []
    cards:
      - square: true
        type: grid
        columns: 2
        cards:
          - type: vertical-stack
            cards:
              - type: custom:button-card
                name: Rosie
                entity: vacuum.robot_2
                show_icon: true
                show_name: true
                show_state: false
                show_label: true
                icon: mdi:robot-vacuum
                size: 40%
                label: |
                  [[[
                    return entity.attributes.status || entity.state;
                  ]]]
                state:
                  - value: cleaning
                    icon: mdi:robot-vacuum
                    styles:
                      card:
                        - background-color: var(--primary-background-color)
                      icon:
                        - color: var(--primary-color)
                        - animation: rotating 2s linear infinite
                  - value: docked
                    icon: mdi:robot-vacuum
                tap_action:
                  action: more-info
                hold_action:
                  action: more-info
                styles:
                  card:
                    - height: 180px
                    - padding: 16px
                    - background-color: var(--card-background-color)
                  icon:
                    - width: 80px
                    - height: 80px
                    - margin-bottom: 10px
                  name:
                    - font-size: 18px
                    - font-weight: bold
                    - margin-bottom: 5px
                  label:
                    - font-size: 14px
                    - color: var(--secondary-text-color)
                  custom_fields:
                    battery:
                      - position: absolute
                      - top: 10px
                      - left: 10px
                      - font-size: 14px
                      - color: var(--secondary-text-color)
                custom_fields:
                  battery: |
                    [[[
                    let battery = states['sensor.robot_2_battery'].state;
                    if (battery) {
                      return `<ha-icon icon="mdi:battery" style="width: 18px; height: 18px; margin-right: 5px;"></ha-icon>${parseInt(battery)}%`;
                    }
                    return '';
                    ]]]
              - type: horizontal-stack
                cards:
                  - type: custom:button-card
                    icon: mdi:play
                    size: 30px
                    tap_action:
                      action: call-service
                      service: vacuum.start
                      service_data:
                        entity_id: vacuum.robot_2
                    state:
                      - entity: vacuum.robot_2
                        value: cleaning
                        styles:
                          card:
                            - opacity: 0.5
                    styles:
                      card:
                        - height: 60px
                        - background-color: transparent
                  - type: custom:button-card
                    icon: mdi:pause
                    size: 30px
                    tap_action:
                      action: call-service
                      service: vacuum.pause
