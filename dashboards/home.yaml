          - type: grid
            columns: 2
            cards:
              - type: thermostat
                entity: climate.mysa_112908_thermostat
                name: Dining room
                show_current_as_primary: false
                features:
                  - type: climate-hvac-modes
              - type: thermostat
                entity: climate.mysa_2fa20c_thermostat
                name: Bedroom
                show_current_as_primary: false
                features:
                  - type: climate-hvac-modes
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Comfort
            heading_style: title
            icon: mdi:home-thermometer
          - type: markdown
            content: |
              {% set ids = [
                'sensor.living_room_sensor_temperature',
                'sensor.kitchen_sensor_temperature',
                'sensor.bedroom_mysa_temperature',
                'sensor.dining_room_sensor_temperature',
                'sensor.gail_office_sensor_temperature',
                'sensor.temperature_humidity_sensor_dca4_temperature',
                'sensor.bedroom_sensor_temperature'
              ] %}
              {% set ns = namespace(total=0, n=0) %}
              {% for e in ids %}
                {% if states(e) not in ['unknown', 'unavailable'] %}
                  {% set ns.total = ns.total + states(e) | float %}
                  {% set ns.n = ns.n + 1 %}
                {% endif %}
              {% endfor %}
              # {{ (ns.total / ns.n) | round(1) if ns.n else '–' }}°C
              Average across {{ ns.n }} rooms
          - type: grid
            columns: 2
            cards:
              - type: tile
                entity: sensor.dining_mysa_humidity
                name: Dining humidity
                icon: mdi:water-percent
                color: blue
              - type: tile
                entity: sensor.bedroom_mysa_humidity
                name: Bedroom humidity
                icon: mdi:water-percent
                color: blue
              - type: tile
                entity: climate.mysa_112908_thermostat
