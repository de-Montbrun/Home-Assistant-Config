title: Home
views:
  - title: Dashboard
    theme: Glass
    path: dashboard
    icon: mdi:view-dashboard
    type: masonry
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            title: Who's Home
            entities:
              - entity: person.gail
                secondary_info: last-changed
              - entity: person.gervais
                secondary_info: last-changed
            state_color: true
          - type: map
            entities:
              - entity: person.gervais
              - entity: person.gail
              - entity: person.jennifer
            default_zoom: 13
            aspect_ratio: '16:9'
            theme_mode: auto
            hours_to_show: 1
      - type: vertical-stack
        cards:
          - type: markdown
            content: '## Quick Actions'
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: light.indoor_lights
                icon: mdi:lightbulb-group
                name: Indoor Lights
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                template: light_button
              - type: custom:button-card
                entity: light.outdoor_lights
                icon: mdi:outdoor-lamp
                name: Outdoor
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                template: light_button
              - type: custom:button-card
                entity: lock.front_door_lock_lock_mechanism
                icon: mdi:door-closed-lock
                name: Front
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                template: lock_button
              - type: custom:button-card
                entity: lock.garage_door_lock_lock_mechanism
                icon: mdi:door-closed-lock
                name: Garage
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
                template: lock_button
              - type: custom:button-card
                entity: alarm_control_panel.alarmo
                name: Security
                tap_action:
                  action: navigate
                  navigation_path: /home-v2/security
                template: nav_button
          - type: conditional
            conditions:
              - entity: sensor.closest_city
                state: Charlottetown
            card:
              type: weather-forecast
              entity: weather.charlottetown_forecast
              show_forecast: false
          - type: conditional
            conditions:
              - entity: sensor.closest_city
                state: Fredericton
            card:
              type: weather-forecast
              entity: weather.fredericton
              show_forecast: false
          - type: conditional
            conditions:
              - entity: sensor.closest_city
                state: Saint John
            card:
              type: weather-forecast
              entity: weather.saint_john_forecast
              show_forecast: false
          - type: conditional
            conditions:
              - entity: sensor.closest_city
                state: Montreal
            card:
              type: weather-forecast
              entity: weather.montreal_forecast
              show_forecast: false
          - type: conditional
            conditions:
              - entity: sensor.closest_city
                state: Halifax
            card:
              type: weather-forecast
              entity: weather.halifax_forecast
              show_forecast: false
          - type: conditional
            conditions:
              - entity: sensor.closest_city
                state: Toronto
            card:
              type: weather-forecast
              entity: weather.toronto_forecast
              show_forecast: false
          - type: conditional
            conditions:
              - entity: sensor.closest_city
                state: Calgary
            card:
              type: weather-forecast
              entity: weather.calgary_forecast
              show_forecast: false
          - type: conditional
            conditions:
              - entity: sensor.closest_city
                state: Atlanta
            card:
              type: weather-forecast
              entity: weather.forecast_atlanta
              show_forecast: false
          - type: conditional
            conditions:
              - entity: sensor.closest_city
                state: Las Vegas
            card:
              type: weather-forecast
              entity: weather.forecast_las_vegas
              show_forecast: false
          - type: conditional
            conditions:
              - condition: numeric_state
                entity: sensor.distance_apart
                above: 0
              - condition: state
                entity: sensor.distance_apart
                state_not: unknown
              - condition: state
                entity: sensor.distance_apart
                state_not: unavailable
            card:
              type: custom:mini-graph-card
              entities:
                - entity: sensor.distance_apart
                  name: Distance Apart
              hours_to_show: 24
              points_per_hour: 4
              line_color: var(--primary-color)
              line_width: 2
              font_size: 75
