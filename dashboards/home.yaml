              {% set ns = namespace(low='–', lowv=101, count=0) %}
              {% for s in states.sensor if s.attributes.device_class == 'battery' and s.state not in ['unknown', 'unavailable'] %}
                {% set v = s.state | float(101) %}
                {% if v < 20 %}
                  {% set ns.count = ns.count + 1 %}
                {% endif %}
                {% if v < ns.lowv %}
                  {% set ns.lowv = v %}
                  {% set ns.low = s.name %}
                {% endif %}
              {% endfor %}
              {% if ns.count > 0 %}
                #### ⚠️ {{ ns.count }} device{{ 's' if ns.count > 1 else '' }} below 20%
              {% else %}
                #### 🟢 Everything above 20%
              {% endif %}
              Lowest: **{{ ns.low }} at {{ ns.lowv | round(0) }}%**
