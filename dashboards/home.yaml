button_card_templates:
  glass:
    color_type: card
    styles:
      card:
        - border-radius: var(--ha-card-border-radius, 22px)
        - border: 1px solid var(--ha-card-border-color, rgba(255, 255, 255, 0.07))
        - box-shadow: var(--ha-card-box-shadow, 0 18px 40px rgba(0, 0, 0, 0.35))
        - background-color: var(--card-background-color)
        - backdrop-filter: blur(16px) saturate(140%)
        - -webkit-backdrop-filter: blur(16px) saturate(140%)
  room:
    template: glass
    show_name: true
    show_state: false
    show_label: true
    size: 34px
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    label: |
      [[[
        if (entity.state !== 'on') return 'Off';
        const b = entity.attributes.brightness;
        return b ? Math.round(b / 2.55) + '% brightness' : 'On';
      ]]]
    styles:
      card:
        - padding: 16px
        - height: 104px
      grid:
        - grid-template-areas: '"i n" "i l"'
        - grid-template-columns: 46px 1fr
        - grid-template-rows: 1fr 1fr
        - column-gap: 12px
      icon:
        - grid-area: i
        - width: 38px
        - height: 38px
        - align-self: center
      name:
        - grid-area: n
        - justify-self: start
        - align-self: end
        - font-size: 14px
        - font-weight: 600
      label:
        - grid-area: l
        - justify-self: start
        - align-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
    state:
      - value: 'on'
        styles:
          card:
            - background: linear-gradient(145deg, rgba(251, 191, 36, 0.20), rgba(251, 191, 36, 0.05))
            - border-color: rgba(251, 191, 36, 0.35)
          icon:
            - color: '#fbbf24'
  person:
    template: glass
    show_name: true
    show_state: true
    show_icon: true
    show_entity_picture: true
    size: 42px
    tap_action:
      action: more-info
    styles:
      card:
        - padding: 14px
        - height: 84px
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 48px 1fr
        - column-gap: 12px
      img_cell:
        - grid-area: i
        - width: 42px
        - height: 42px
        - align-self: center
      icon:
        - grid-area: i
        - width: 42px
        - height: 42px
        - align-self: center
      name:
        - grid-area: n
        - justify-self: start
        - align-self: end
        - font-size: 14px
        - font-weight: 600
      state:
        - grid-area: s
        - justify-self: start
        - align-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
    state:
      - value: home
        styles:
          state:
            - color: '#34d399'
      - value: not_home
        styles:
          state:
            - color: var(--secondary-text-color)
  alarm:
    template: glass
    entity: alarm_control_panel.alarmo
    show_name: true
    show_state: true
    show_label: false
    icon: mdi:shield-home
    tap_action:
      action: navigate
      navigation_path: /home-v2/security
    state_display: |
      [[[
        return entity.state.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      ]]]
    styles:
      card:
        - padding: 14px
        - height: 84px
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 40px 1fr
        - column-gap: 12px
      icon:
        - grid-area: i
        - width: 34px
        - height: 34px
        - align-self: center
        - color: |
            [[[
              if (entity.state === 'triggered') return '#fb7185';
              return entity.state.startsWith('armed') ? '#34d399' : '#fbbf24';
            ]]]
      name:
        - grid-area: n
        - justify-self: start
        - align-self: end
        - font-size: 14px
        - font-weight: 600
      state:
        - grid-area: s
        - justify-self: start
        - align-self: start
        - font-size: 12px
        - color: var(--secondary-text-color)
  battery:
    template: glass
    show_name: true
    show_state: true
    show_label: false
    size: 26px
    tap_action:
      action: more-info
    state_display: |
      [[[
        const v = parseFloat(entity.state);
        return isNaN(v) ? entity.state : Math.round(v) + '%';
      ]]]
    icon: |
      [[[
        const v = parseFloat(entity.state);
        if (isNaN(v)) return 'mdi:battery-unknown';
        if (v >= 95) return 'mdi:battery';
        return 'mdi:battery-' + Math.max(10, Math.floor(v / 10) * 10);
      ]]]
    styles:
      card:
        - padding: 12px 14px
        - height: 74px
      grid:
        - grid-template-areas: '"i n" "i s"'
        - grid-template-columns: 30px 1fr
        - column-gap: 10px
      icon:
        - grid-area: i
        - align-self: center
        - width: 26px
        - height: 26px
        - color: |
            [[[
              const v = parseFloat(entity.state);
              if (isNaN(v)) return 'var(--disabled-text-color)';
              return v < 20 ? '#fb7185' : (v < 40 ? '#fbbf24' : '#34d399');
            ]]]
      name:
        - grid-area: n
        - justify-self: start
        - align-self: end
        - font-size: 12px
        - color: var(--secondary-text-color)
        - white-space: nowrap
        - overflow: hidden
        - text-overflow: ellipsis
      state:
        - grid-area: s
        - justify-self: start
        - align-self: start
        - font-size: 16px
        - font-weight: 600
  sensor:
    template: glass
    show_name: true
    show_state: true
    tap_action:
      action: more-info
    styles:
      card:
        - padding: 14px
        - height: 92px
      grid:
        - grid-template-areas: '"i n" "s s"'
        - grid-template-columns: 1fr auto
        - row-gap: 4px
      icon:
        - grid-area: i
        - justify-self: start
        - width: 22px
        - height: 22px
        - color: var(--state-icon-color)
      name:
        - grid-area: n
        - justify-self: end
        - align-self: center
        - font-size: 12px
        - color: var(--secondary-text-color)
      state:
        - grid-area: s
        - justify-self: start
        - font-size: 22px
        - font-weight: 600
  weather_hero:
    template: glass
    entity: sensor.closest_city
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: navigate
      navigation_path: /home-v2/weather
    custom_fields:
      content: |
        [[[
          const cityEntity = states['sensor.closest_city'];
          const a = (cityEntity && cityEntity.attributes) || {};
          const condEntity = a.condition_entity && states[a.condition_entity];
          const condition = condEntity ? condEntity.state : 'unknown';
          const tempEntity = a.temperature_entity && states[a.temperature_entity];
          const temp = tempEntity && tempEntity.state !== 'unknown' ? tempEntity.state : '–';
          const city = cityEntity ? cityEntity.state : 'Weather';
          const warnEntity = a.warnings_entity && states[a.warnings_entity];
          const warn = warnEntity && !['unknown', 'unavailable', 'none', 'None', ''].includes(warnEntity.state);
          const map = {
            'clear-night': 'mdi:weather-night',
            'cloudy': 'mdi:weather-cloudy',
            'exceptional': 'mdi:alert-circle-outline',
            'fog': 'mdi:weather-fog',
            'hail': 'mdi:weather-hail',
            'lightning': 'mdi:weather-lightning',
            'lightning-rainy': 'mdi:weather-lightning-rainy',
            'partlycloudy': 'mdi:weather-partly-cloudy',
            'pouring': 'mdi:weather-pouring',
            'rainy': 'mdi:weather-rainy',
            'snowy': 'mdi:weather-snowy',
            'snowy-rainy': 'mdi:weather-snowy-rainy',
            'sunny': 'mdi:weather-sunny',
            'windy': 'mdi:weather-windy',
            'windy-variant': 'mdi:weather-windy-variant'
          };
          const label = condition.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
          const icon = map[condition] || 'mdi:weather-partly-cloudy';
          return `
            <div style="display:flex;align-items:center;gap:20px;text-align:left;width:100%">
              <div style="flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:76px;height:76px;border-radius:24px;background:radial-gradient(circle at 30% 25%, rgba(125,211,252,0.35), rgba(125,211,252,0.06));border:1px solid rgba(125,211,252,0.25)">
                <ha-icon icon="${icon}" style="color:#7dd3fc;--mdc-icon-size:44px"></ha-icon>
              </div>
              <div style="min-width:0">
                <div style="font-size:42px;font-weight:700;line-height:1;letter-spacing:-1.5px">${temp}<span style="font-size:20px;font-weight:500;vertical-align:top;color:var(--secondary-text-color)">°C</span></div>
                <div style="color:var(--secondary-text-color);font-size:14px;margin-top:6px">${label} · ${city}</div>
                ${warn ? '<div style="margin-top:8px;display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(251,113,133,0.18);border:1px solid rgba(251,113,133,0.35);color:#fb7185;font-size:12px">Weather alert</div>' : ''}
              </div>
            </div>`;
        ]]]
    styles:
      card:
        - padding: 22px
        - height: 100%
        - min-height: 176px
      custom_fields:
        content:
          - width: 100%
