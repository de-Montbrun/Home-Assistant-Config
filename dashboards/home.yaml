      card:
        - padding: 10px
        - border-radius: 10px
      name:
        - font-size: 14px
        - color: var(--primary-text-color, #e8ebf2)
      state:
        - font-size: 12px
        - color: var(--secondary-text-color, #9ba3b4)
    state:
      - value: 'on'
        styles:
          card:
            - background-color: var(--state-active-card-background, rgba(245, 201, 123, 0.14))
          icon:
            - color: var(--state-icon-active-color, #f5c97b)
          state:
            - color: var(--state-icon-active-color, #f5c97b)
      - value: 'off'
        styles:
          card:
            - background-color: var(--paper-card-background-color, rgba(22, 25, 32, 0.72))
          icon:
            - color: var(--paper-item-icon-color, #8b94a7)
  lock_button:
    template: light_button
    state:
      - value: locked
        icon: mdi:lock
        styles:
          card:
            - background-color: var(--state-active-card-background, rgba(245, 201, 123, 0.14))
          icon:
            - color: var(--state-icon-active-color, #f5c97b)
          state:
            - color: var(--state-icon-active-color, #f5c97b)
      - value: unlocked
        icon: mdi:lock-open
        styles:
          card:
            - background-color: var(--state-alert-card-background, rgba(242, 135, 155, 0.16))
          icon:
            - color: var(--error-color, #f2879b)
          state:
            - color: var(--error-color, #f2879b)
  nav_button:
    size: 50px
    styles:
      card:
        - padding: 10px
        - border-radius: 10px
        - background-color: var(--paper-card-background-color, rgba(22, 25, 32, 0.72))
      name:
        - font-size: 14px
        - color: var(--primary-text-color, #e8ebf2)
  section_header:
    color_type: label-card
    styles:
      card:
        - padding: 0
        - background-color: transparent
        - box-shadow: none
        - border: none
      name:
        - font-size: 18px
        - font-weight: bold
        - padding-left: 10px
