  # {{{ Weather
  - title: Weather
    path: weather
    icon: mdi:weather-partly-cloudy
    theme: Glass
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:button-card
            template: weather_hero
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Alerts
            heading_style: title
            icon: mdi:alert-outline
          - type: markdown
            content: |
              {% set a = state_attr('sensor.closest_city', 'warnings_entity') %}
              {% set city = states('sensor.closest_city') %}
              {% set warnings = states(a) if a else 'unknown' %}
              {% if warnings not in ['unknown', 'unavailable', 'none', '', 'None'] %}
                **⚠️ Active warning for {{ city }}:** {{ warnings }}
              {% else %}
                🟢 No active weather alerts for **{{ city }}**.
              {% endif %}
          - type: markdown
            content: |
              {% set a = state_attr('sensor.closest_city', 'humidex_entity') %}
              {% set u = state_attr('sensor.closest_city', 'uv_index_entity') %}
              {% set w = state_attr('sensor.closest_city', 'wind_chill_entity') %}
              | Measure | Value |
              |---|---|
              | 🌡️ Humidex | {{ states(a) if a else '–' }} |
              | ☀️ UV index | {{ states(u) if u else '–' }} |
              | 🥶 Wind chill | {{ states(w) if w else '–' }} |
              | 🌅 Sunrise | {{ as_timestamp(state_attr('sun.sun', 'next_dawn')) | timestamp_custom('%-I:%M %p') }} |
              | 🌇 Sunset | {{ as_timestamp(state_attr('sun.sun', 'next_dusk')) | timestamp_custom('%-I:%M %p') }} |
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Closest city forecast
            heading_style: title
            icon: mdi:weather-partly-cloudy
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.closest_city
                state: Charlottetown
            card:
              type: weather-forecast
              entity: weather.charlottetown_forecast
              forecast_type: daily
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.closest_city
                state: Fredericton
            card:
              type: weather-forecast
              entity: weather.fredericton
              forecast_type: daily
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.closest_city
                state: Saint John
            card:
              type: weather-forecast
              entity: weather.saint_john_forecast
              forecast_type: daily
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.closest_city
                state: Montreal
            card:
              type: weather-forecast
              entity: weather.montreal_forecast
              forecast_type: daily
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.closest_city
                state: Halifax
            card:
              type: weather-forecast
              entity: weather.halifax_forecast
              forecast_type: daily
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.closest_city
                state: Toronto
            card:
              type: weather-forecast
              entity: weather.toronto_forecast
              forecast_type: daily
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.closest_city
                state: Calgary
            card:
              type: weather-forecast
              entity: weather.calgary_forecast
              forecast_type: daily
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.closest_city
                state: Atlanta
            card:
              type: weather-forecast
              entity: weather.forecast_atlanta
              forecast_type: daily
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.closest_city
