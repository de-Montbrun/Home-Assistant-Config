                name: Living
                icon: mdi:sofa
              - type: custom:button-card
                template: sensor
                entity: sensor.kitchen_sensor_temperature
                name: Kitchen
                icon: mdi:chef-hat
              - type: custom:button-card
                template: sensor
                entity: sensor.dining_room_sensor_temperature
                name: Dining
                icon: mdi:silverware-fork-knife
              - type: custom:button-card
                template: sensor
                entity: sensor.bedroom_mysa_temperature
                name: Bedroom
                icon: mdi:bed
              - type: custom:button-card
                template: sensor
                entity: sensor.gail_office_sensor_temperature
                name: Gail office
                icon: mdi:desk
              - type: custom:button-card
                template: sensor
                entity: sensor.temperature_humidity_sensor_dca4_temperature
                name: G-desk
                icon: mdi:laptop
              - type: custom:button-card
