              # {{ 'Good morning' if now().hour < 12 else ('Good afternoon' if now().hour < 18 else 'Good evening') }}
              **{{ now().strftime('%A, %B %d') }}** · {{ states.person | selectattr('state', 'eq', 'home') | list | count }} home · {{ states('alarm_control_panel.alarmo') | replace('_', ' ') | title }}
