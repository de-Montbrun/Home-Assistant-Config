---
# Glass - dark frosted theme for the main dashboard.
# Apply per view with `theme: Glass`, or globally via
# User profile > Appearance > Theme.
Glass:
  # {{{ Base palette
  # Deliberately neutral: near-black graphite surfaces, one soft periwinkle
  # accent, warm amber only for "on" states. No saturated neon.
  primary-color: "#8fb4ff"
  accent-color: "#8fb4ff"
  dark-primary-color: "#6d93e0"
  light-primary-color: "#b9cfff"
  primary-background-color: "#0b0d11"
  secondary-background-color: "#11141a"
  primary-text-color: "#e8ebf2"
  secondary-text-color: "#9ba3b4"
  disabled-text-color: "rgba(155, 163, 180, 0.4)"
  divider-color: "rgba(255, 255, 255, 0.07)"
  error-color: "#f2879b"
  warning-color: "#f5c97b"
  success-color: "#7bd8b0"
  info-color: "#8fb4ff"
  # }}}
  # {{{ Surfaces
  # Fairly opaque so text stays readable over the gradient, plus a real
  # backdrop blur on every ha-card - that is what makes it read as glass.
  card-background-color: "rgba(22, 25, 32, 0.72)"
  ha-card-background: "rgba(22, 25, 32, 0.72)"
  paper-card-background-color: "rgba(22, 25, 32, 0.72)"
  ha-card-backdrop-filter: "blur(12px) saturate(125%)"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(255, 255, 255, 0.075)"
  ha-card-border-radius: "18px"
  # Outer shadow for depth + a hairline top highlight, which is what makes a
  # flat surface read as glass rather than as a translucent rectangle.
  ha-card-box-shadow: >-
    0 14px 34px rgba(0, 0, 0, 0.42),
    inset 0 1px 0 rgba(255, 255, 255, 0.05)
  ha-card-header-font-size: "18px"
  ha-card-header-color: "#e8ebf2"
  # }}}
  # {{{ Page background
  # One cool wash top-left, a faint warm one top-right, and a dark vertical
  # falloff. Low opacity on purpose - it should be felt, not noticed.
  lovelace-background: >-
    radial-gradient(at 8% -8%, rgba(143, 180, 255, 0.12) 0px, transparent 52%),
    radial-gradient(at 94% 0%, rgba(180, 142, 173, 0.07) 0px, transparent 46%),
    radial-gradient(at 55% 112%, rgba(123, 216, 176, 0.05) 0px, transparent 55%),
    linear-gradient(180deg, #0b0d11 0%, #0d1016 48%, #090b0e 100%)
  # }}}
  # {{{ App chrome
  app-header-background-color: "rgba(11, 13, 17, 0.88)"
  app-header-text-color: "#e8ebf2"
  sidebar-background-color: "#0a0c10"
  sidebar-text-color: "#c3cad8"
  sidebar-icon-color: "#8b94a7"
  sidebar-selected-text-color: "#eef2fa"
  sidebar-selected-icon-color: "#8fb4ff"
  # }}}
  # {{{ States
  # Amber = on / active, so a lit room reads instantly against the cool base.
  paper-item-icon-color: "#8b94a7"
  paper-item-icon-active-color: "#f5c97b"
  state-icon-color: "#8b94a7"
  state-icon-active-color: "#f5c97b"
  state-active-color: "#f5c97b"
  state-inactive-color: "#8b94a7"
  state-unavailable-color: "#5a6274"
  state-icon-unavailable-color: "#5a6274"
  state-climate-heat-color: "#f5a06b"
  state-climate-cool-color: "#8fb4ff"
  state-climate-heat-cool-color: "#c9a2e0"
  state-light-active-color: "#f5c97b"
  state-lock-locked-color: "#7bd8b0"
  state-lock-unlocked-color: "#f2879b"
  state-alarm-armed-color: "#7bd8b0"
  state-alarm-disarmed-color: "#9ba3b4"
  state-alarm-triggered-color: "#f2879b"
  # }}}
  # {{{ Stateful buttons (custom:button-card quick actions)
  # A solid amber slab behind white text was unreadable, so "on"/"locked"
  # is a tinted surface with a coloured icon and normal light text. "Alert"
  # is the same treatment in red. Change these two values to retune it.
  state-active-card-background: "rgba(245, 201, 123, 0.14)"
  state-alert-card-background: "rgba(242, 135, 155, 0.16)"
  # }}}
  # {{{ Controls
  paper-slider-knob-color: "#8fb4ff"
  paper-slider-knob-start-color: "#8fb4ff"
  paper-slider-pin-color: "#8fb4ff"
  paper-slider-active-color: "#8fb4ff"
  paper-slider-container-color: "rgba(255, 255, 255, 0.1)"
  paper-slider-secondary-color: "rgba(143, 180, 255, 0.32)"
  paper-toggle-button-checked-button-color: "#8fb4ff"
  paper-toggle-button-checked-bar-color: "rgba(143, 180, 255, 0.55)"
  switch-checked-color: "#8fb4ff"
  switch-checked-button-color: "#8fb4ff"
  switch-checked-track-color: "rgba(143, 180, 255, 0.45)"
  # }}}
  # {{{ Charts
  graph-colors: "#8fb4ff, #b48ead, #7bd8b0, #f5c97b, #f2879b"
  history-unknown-color: "#5a6274"
  # }}}
  # {{{ Energy dashboard
  energy-grid-consumption-color: "#8fb4ff"
  energy-grid-return-color: "#b48ead"
  energy-solar-color: "#f5c97b"
  energy-battery-in-color: "#7bd8b0"
  energy-battery-out-color: "#f2879b"
  energy-gas-color: "#e8a87c"
  energy-water-color: "#7fc7e8"
  # }}}
