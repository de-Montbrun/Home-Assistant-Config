learn_garage:
  sequence:
  - data:
      command:
      - power
      - flame_light
      - heat_lvl
      - temp_down
      - temp_up
      - palette
      - brightness
      - timer
      device: livingroom_fireplace
      command_type: ir
    target:
      device_id: 3323fa71fdf8cef9787ac53a2a2b12f3
    action: remote.learn_command
  alias: eRemote Living Room Learn Script
  mode: single
  icon: mdi:remote
eremote_garage_forget_script:
  alias: eRemote Living Room Forget Script
  sequence:
  - data:
      device: livingroom_fireplace
      command:
      - power
      - heat_lvl
      - timer
    target:
      device_id: 3323fa71fdf8cef9787ac53a2a2b12f3
    action: remote.delete_command
  mode: single
  icon: mdi:remote
